name: Build & Deploy Blog to Azure Web App (App Service)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write   # Passwordless OIDC authentication with Microsoft Entra ID
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies and build frontend + server bundle
        run: |
          npm ci
          npm run build
          npx esbuild server.ts \
            --bundle \
            --platform=node \
            --format=esm \
            --packages=external \
            --outfile=dist-server/server.mjs
          npm prune --omit=dev

      - name: Prepare lightweight deployment package
        run: |
          mkdir -p deploy_pkg
          cp -r dist dist-server node_modules package.json deploy_pkg/

      - name: Azure Login via OIDC (Zero Secrets)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_WEBAPP_NAME }}
          package: ./deploy_pkg
