<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="300" height="300">
  <defs>
    <!-- Rosette Azure Blue Gradient -->
    <linearGradient id="appliedRosetteGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1ba1e2"/>
      <stop offset="35%" stop-color="#0078d4"/>
      <stop offset="100%" stop-color="#005a9e"/>
    </linearGradient>

    <!-- Center Light/Ice Blue Gradient -->
    <linearGradient id="appliedCenterGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#f0f6fc"/>
      <stop offset="100%" stop-color="#dceaf7"/>
    </linearGradient>

    <!-- Center Star Azure Blue Gradient -->
    <linearGradient id="appliedStarGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2eb3ff"/>
      <stop offset="45%" stop-color="#0084de"/>
      <stop offset="100%" stop-color="#0067b8"/>
    </linearGradient>

    <!-- Drop Shadows -->
    <filter id="rosetteDrop" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#002050" flood-opacity="0.2"/>
    </filter>

    <filter id="starDrop" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#004578" flood-opacity="0.2"/>
    </filter>
  </defs>

