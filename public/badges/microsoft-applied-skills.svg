<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Rosette Blue Gradient -->
    <linearGradient id="rosetteGrad" x1="0%" y1="0%" x2="100%" y2="100%">
