    </filter>

    <filter id="innerRimShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#004578" flood-opacity="0.3"/>
    </filter>

    <filter id="starShadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#004578" flood-opacity="0.25"/>
    </filter>
  </defs>

