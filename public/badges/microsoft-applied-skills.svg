      <stop offset="50%" stop-color="#0091ea"/>
      <stop offset="100%" stop-color="#0078d4"/>
    </linearGradient>

    <!-- Drop Shadows -->
    <filter id="badgeShadow" x="-10%" y="-10%" width="125%" height="125%">
